# Blueprint do Render — https://render.com/docs/blueprint-spec
#
# Descreve apenas o serviço web. O banco fica no Neon, fora deste arquivo:
# o Postgres gerenciado do Render expirava em 30 dias no free tier, e o do Neon
# não expira. No painel do Render: New > Blueprint, aponte para este repositório.
#
# Este é um deploy de demonstração: CHECKOUT_HABILITADO fica em false e não há
# credenciais do Mercado Pago. A loja funciona para navegar, montar carrinho,
# criar conta e usar o painel — só a finalização de compra está desligada.

services:
  - type: web
    name: petabyte
    runtime: node
    plan: free
    buildCommand: npm ci
    # As migrations rodam antes de subir. São idempotentes, então repetir a
    # cada deploy é seguro, e um banco recém-criado é preparado sozinho.
    startCommand: npm run migrate && npm start
    healthCheckPath: /health

    envVars:
      # String de conexão do Neon, colada à mão no painel do Render. Traz
      # usuário e senha dentro dela, então NUNCA entra neste arquivo: o
      # repositório é público. Use o endpoint com "-pooler" no nome — o Render
      # abre e fecha conexões a cada wake-up do free tier, e o pooler do Neon
      # absorve isso sem estourar o limite de conexões diretas.
      #
      # Prefira terminar a URL com ?sslmode=verify-full em vez de
      # ?sslmode=require: hoje o pg trata os dois igual, mas a partir do pg 9 o
      # "require" passa a significar TLS sem verificar certificado.
      #
      # Não defina DATABASE_SSL aqui. Quando a URL traz sslmode, é ele que vale;
      # a variável vira decorativa. Ela só existe para URLs sem sslmode.
      - key: DATABASE_URL
        sync: false

      # Gerado pelo Render no primeiro deploy. Fica só no painel, nunca no Git.
      - key: JWT_SECRET
        generateValue: true

      # Sem isto, o rate limit trata todos os visitantes como um único IP,
      # porque atrás do proxy o endereço real vem em X-Forwarded-For.
      - key: TRUST_PROXY
        value: "1"

      # Desliga a finalização de compra. O servidor recusa /pagamentos/criar e
      # a loja mostra o aviso de demonstração.
      - key: CHECKOUT_HABILITADO
        value: "false"

      # Preencher no painel depois do primeiro deploy, com a URL que o Render
      # atribuir (algo como https://petabyte.onrender.com). Alimenta os links
      # de redefinição de senha.
      - key: APP_BASE_URL
        sync: false

      - key: CORS_ORIGINS
        sync: false

      # E-mail. Sem SMTP, NINGUÉM cria conta com senha: o cadastro exige
      # confirmar o e-mail por link, e sem envio o servidor desfaz a conta e
      # responde 502. Também é o que manda os links de recuperação de senha.
      # O login com Google continua funcionando sem isto.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false

      # Client ID do login com Google (não é segredo; não há client secret).
      # Vazio, o botão não aparece. No Google Cloud Console, a URL do Render
      # precisa constar em "Origens JavaScript autorizadas", ou o botão recusa.
      - key: GOOGLE_CLIENT_ID
        sync: false

      - key: NODE_ENV
        value: production
