<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Petabyte | Redefinir senha</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body class="pagina-conta">
    <main class="caixa-conta">
        <a class="marca" href="E-Commerce.html">Peta<em>byte</em></a>
        <h1>Redefinir senha</h1>
        <p class="muted" style="text-align:center;margin-top:-.8rem">Informe sua nova senha abaixo.</p>

        <form id="resetForm" class="empilhado">
            <div>
                <label for="novaSenha">Nova senha</label>
                <input id="novaSenha" type="password" placeholder="Digite a nova senha" autocomplete="new-password" required>
            </div>
            <div>
                <label for="confirmarNovaSenha">Confirmar nova senha</label>
                <input id="confirmarNovaSenha" type="password" placeholder="Repita a nova senha" autocomplete="new-password" required>
            </div>
            <button class="btn btn-primary btn-bloco" type="submit">Salvar nova senha</button>
        </form>

        <div class="rodape-conta">
            <p><a href="auth.html">Voltar para o login</a></p>
        </div>
    </main>

    <script>
        // Página independente do script.js: ela roda antes de existir sessão e
        // não precisa de carrinho, catálogo nem autenticação.
        function resolverApiBaseUrl() {
            if (window.__PETABYTE_API_BASE_URL) {
                return window.__PETABYTE_API_BASE_URL;
            }

            if (window.location.protocol === 'file:') {
                return 'http://localhost:3000';
            }

            // Mesma origem da página. Fixar :3000 aqui quebrava qualquer porta
            // alternativa (testes, staging, container).
            return window.location.origin || 'http://localhost:3000';
        }

        const API_BASE_URL = resolverApiBaseUrl().replace(/\/$/, '');

        function apiUrl(path) {
            return `${API_BASE_URL}${path.startsWith('/') ? path : `/${path}`}`;
        }

        async function lerResposta(response) {
            const texto = await response.text();

            if (!texto) {
                return {};
            }

            try {
                return JSON.parse(texto);
            } catch (error) {
                return { mensagem: texto };
            }
        }

        const params = new URLSearchParams(window.location.search);
        const token = params.get('token');
        const form = document.getElementById('resetForm');

        form.addEventListener('submit', async (event) => {
            event.preventDefault();
            const senha = document.getElementById('novaSenha').value;
            const confirmar = document.getElementById('confirmarNovaSenha').value;

            if (!token) {
                alert('Token inválido ou ausente.');
                return;
            }

            if (senha !== confirmar) {
                alert('As senhas não coincidem.');
                return;
            }

            try {
                const response = await fetch(apiUrl('/auth/redefinir-senha'), {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, senha })
                });
                const data = await lerResposta(response);
                if (!response.ok) throw new Error(data.mensagem || 'Erro ao redefinir a senha.');
                alert(data.mensagem || 'Senha redefinida com sucesso!');
                window.location.href = 'auth.html';
            } catch (error) {
                alert(error.message || 'Não foi possível redefinir a senha.');
            }
        });
    </script>
</body>
</html>
