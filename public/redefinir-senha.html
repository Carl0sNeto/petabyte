<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Petabyte | Redefinir senha</title>
    <style>
        :root { --primary:#2563eb; --bg:#f8fafc; --card:#fff; --text:#0f172a; --border:#e2e8f0; }
        * { box-sizing: border-box; }
        body { margin:0; font-family: Arial, Helvetica, sans-serif; background:var(--bg); color:var(--text); min-height:100vh; display:grid; place-items:center; }
        .container { width:min(460px, calc(100% - 2rem)); background:var(--card); border:1px solid var(--border); border-radius:1rem; padding:1.5rem; box-shadow:0 10px 25px rgba(15,23,42,0.08); }
        h1 { margin-top:0; }
        form { display:flex; flex-direction:column; gap:0.8rem; }
        input { padding:0.8rem 1rem; border:1px solid var(--border); border-radius:0.75rem; }
        .btn { padding:0.8rem 1rem; border:none; border-radius:999px; font-weight:700; cursor:pointer; background:var(--primary); color:white; }
        .muted { color:#64748b; font-size:0.95rem; }
        .hidden { display:none; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Redefinir senha</h1>
        <p class="muted">Informe sua nova senha abaixo.</p>
        <form id="resetForm">
            <input id="novaSenha" type="password" placeholder="Nova senha" required>
            <input id="confirmarNovaSenha" type="password" placeholder="Confirmar nova senha" required>
            <button class="btn" type="submit">Salvar nova senha</button>
        </form>
        <p class="muted"><a href="auth.html">Voltar para o login</a></p>
    </div>

    <script>
        function resolverApiBaseUrl() {
            if (window.__PETABYTE_API_BASE_URL) {
                return window.__PETABYTE_API_BASE_URL;
            }

            if (window.location.protocol === 'file:') {
                return 'http://localhost:3000';
            }

            const hostname = window.location.hostname;
            if (hostname === 'localhost' || hostname === '127.0.0.1') {
                return `${window.location.protocol}//${hostname}:3000`;
            }

            return window.location.origin || 'http://localhost:3000';
        }

        const API_BASE_URL = resolverApiBaseUrl().replace(/\/$/, '');
        function apiUrl(path) {
            return `${API_BASE_URL}${path.startsWith('/') ? path : `/${path}`}`;
        }

        async function lerResposta(response) {
            const texto = await response.text();

            if (!texto) {
                return {};
            }

            try {
                return JSON.parse(texto);
            } catch (error) {
                return { mensagem: texto };
            }
        }

        const params = new URLSearchParams(window.location.search);
        const token = params.get('token');
        const form = document.getElementById('resetForm');

        form.addEventListener('submit', async (event) => {
            event.preventDefault();
            const senha = document.getElementById('novaSenha').value;
            const confirmar = document.getElementById('confirmarNovaSenha').value;

            if (!token) {
                alert('Token inválido ou ausente.');
                return;
            }

            if (senha !== confirmar) {
                alert('As senhas não coincidem.');
                return;
            }

            try {
                const response = await fetch(apiUrl('/auth/redefinir-senha'), {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, senha })
                });
                const data = await lerResposta(response);
                if (!response.ok) throw new Error(data.mensagem || 'Erro ao redefinir a senha.');
                alert(data.mensagem || 'Senha redefinida com sucesso!');
                window.location.href = 'auth.html';
            } catch (error) {
                alert(error.message || 'Não foi possível redefinir a senha.');
            }
        });
    </script>
</body>
</html>
