<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Petabyte | Entrar ou criar conta</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%23081221'/><text x='16' y='23' font-family='sans-serif' font-size='20' font-weight='700' fill='%2322d3ee' text-anchor='middle'>P</text></svg>">
    <link rel="stylesheet" href="estilos.css">
</head>
<body class="pagina-conta">
    <main class="caixa-conta">
        <a class="marca" href="E-Commerce.html">Peta<em>byte</em></a>
        <h1>Acesse sua conta</h1>

        <div class="abas" role="tablist">
            <button class="aba active" type="button" data-target="login" role="tab">Entrar</button>
            <button class="aba" type="button" data-target="register" role="tab">Criar conta</button>
        </div>

        <form id="loginForm" class="empilhado">
            <div>
                <label for="loginEmail">E-mail</label>
                <input id="loginEmail" type="email" placeholder="voce@exemplo.com" autocomplete="email" required>
            </div>
            <div>
                <label for="loginSenha">Senha</label>
                <input id="loginSenha" type="password" placeholder="Sua senha" autocomplete="current-password" required>
            </div>
            <button class="btn btn-primary btn-bloco" type="submit">Entrar</button>
        </form>

        <form id="registerForm" class="empilhado hidden">
            <div>
                <label for="registerNome">Nome completo</label>
                <input id="registerNome" type="text" placeholder="Como devemos te chamar" autocomplete="name" required>
            </div>
            <div>
                <label for="registerEmail">E-mail</label>
                <input id="registerEmail" type="email" placeholder="voce@exemplo.com" autocomplete="email" required>
            </div>
            <div>
                <label for="registerSenha">Senha</label>
                <input id="registerSenha" type="password" placeholder="Crie uma senha" autocomplete="new-password" required>
            </div>
            <div>
                <label for="confirmarSenha">Confirmar senha</label>
                <input id="confirmarSenha" type="password" placeholder="Repita a senha" autocomplete="new-password" required>
            </div>
            <button class="btn btn-primary btn-bloco" type="submit">Criar conta</button>
        </form>

        <form id="recoverForm" class="empilhado hidden">
            <div>
                <label for="recoverEmail">E-mail cadastrado</label>
                <input id="recoverEmail" type="email" placeholder="voce@exemplo.com" autocomplete="email" required>
            </div>
            <button class="btn btn-primary btn-bloco" type="submit">Enviar link de recuperação</button>
        </form>

        <div class="rodape-conta">
            <p><a href="#" id="toggleRecover">Esqueci minha senha</a></p>
            <p><a href="E-Commerce.html">Voltar para a loja</a></p>
        </div>
    </main>

    <script src="sessao.js"></script>
    <script src="script.js"></script>
</body>
</html>
