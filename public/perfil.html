<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Petabyte | Meu perfil</title>
    <style>
        :root {
            --primary: #2563eb;
            --secondary: #111827;
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #0f172a;
            --border: #e2e8f0;
            --muted: #64748b;
        }

        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: var(--bg);
            color: var(--text);
        }

        .container { width: min(1100px, calc(100% - 2rem)); margin: 0 auto; }
        header { background: linear-gradient(135deg, var(--secondary), #1e293b); color: white; padding: 1rem 0; }
        .topbar { display: flex; justify-content: space-between; align-items: center; }
        .brand { font-size: 1.3rem; font-weight: 700; }
        .btn { padding: 0.8rem 1rem; border-radius: 999px; border: none; font-weight: 700; cursor: pointer; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-secondary { background: white; color: var(--secondary); border: 1px solid var(--border); }
        main { padding: 2rem 0; }
        .grid { display: grid; grid-template-columns: 0.9fr 1.1fr; gap: 1.2rem; }
        .card { background: white; border: 1px solid var(--border); border-radius: 1rem; padding: 1.2rem; box-shadow: 0 10px 25px rgba(15, 23, 42, 0.05); }
        .profile-box p { color: var(--muted); }
        .orders { display: flex; flex-direction: column; gap: 0.8rem; }
        .order-item { border: 1px solid var(--border); border-radius: 0.8rem; padding: 0.9rem; }
        .muted { color: var(--muted); }
        .empty-state { padding: 1rem; border: 1px dashed var(--border); border-radius: 0.8rem; color: var(--muted); background: #f8fafc; }
        @media (max-width: 800px) { .grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <header>
        <div class="container topbar">
            <div class="brand">Petabyte</div>
            <a class="btn btn-secondary" href="E-Commerce.html">Voltar à loja</a>
        </div>
    </header>

    <main class="container">
        <div class="grid">
            <section class="card profile-box" id="profileSection">
                <h2>Meu perfil</h2>
                <p id="profileName">Carregando...</p>
                <p id="profileEmail" class="muted"></p>
                <button class="btn btn-primary" id="logoutBtn">Sair da conta</button>
            </section>

            <section class="card" id="ordersSection">
                <h2>Minhas compras</h2>
                <div class="orders" id="ordersList">
                    <div class="empty-state">Faça login para ver suas compras e pedidos.</div>
                </div>
            </section>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
