<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Petabyte | Meus pedidos</title>
    <link rel="stylesheet" href="estilos.css">
    <style>
        .pedido {
            border: 1px solid var(--borda);
            border-left: 3px solid var(--acao);
            border-radius: var(--raio);
            padding: .95rem 1.1rem;
            background: var(--superficie-2);
        }
        .pedido strong { display: block; font-size: .93rem; margin-bottom: .2rem; }
        .lista-pedidos { display: flex; flex-direction: column; gap: .8rem; }
    </style>
</head>
<body>
    <header class="topo">
        <div class="container topo-barra">
            <a class="marca" href="E-Commerce.html">Peta<em>byte</em> <span>Tecnologia</span></a>
            <nav class="topo-nav" aria-label="Navegação">
                <a href="E-Commerce.html">Voltar à loja</a>
                <a class="link-carrinho" href="cart.html">
                    Carrinho <span id="cartCount" class="contador-carrinho">0</span>
                </a>
            </nav>
        </div>
    </header>

    <main class="container">
        <div class="secao-titulo">
            <h1>Minha conta</h1>
            <span class="apoio">Dados cadastrais e histórico de compras</span>
        </div>

        <div class="grade-perfil">
            <section class="card" id="profileSection">
                <h2>Meu perfil</h2>
                <p id="profileName">Carregando...</p>
                <p id="profileEmail" class="muted"></p>
                <button class="btn btn-secondary btn-bloco" type="button" id="logoutBtn">Sair da conta</button>
            </section>

            <section class="card" id="ordersSection">
                <h2>Minhas compras</h2>
                <div class="lista-pedidos" id="ordersList">
                    <div class="estado-vazio">Faça login para ver suas compras e pedidos.</div>
                </div>
            </section>
        </div>
    </main>

    <footer class="rodape">
        <div class="container rodape-fim">
            <span>Petabyte © 2026 — Todos os direitos reservados.</span>
            <span>Pagamentos via Mercado Pago</span>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
